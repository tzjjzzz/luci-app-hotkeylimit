<!doctype html>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>热键限速</title>
<style>body{font:15px sans-serif;max-width:420px;margin:1em auto;padding:0 1em}
input,select,button{font:inherit;width:100%;box-sizing:border-box;margin:3px 0;padding:6px}
#s{font-size:1.4em;text-align:center;padding:.5em;border-radius:6px;background:#8c8;margin:.5em 0}
#s.on{background:#e77}</style>
<div id=lg hidden>
<input id=u value=root placeholder=用户名><input id=p type=password placeholder=密码>
<button onclick=login()>登录</button></div>
<div id=m hidden>
<select id=d></select>
上传 KB/s (-1=禁止, 0=不限)<input id=up type=number min=-1 value=-1>
下载 KB/s (-1=禁止, 0=不限)<input id=dn type=number min=-1 value=0>
热键：<button id=hk onclick=capture()></button>
<div id=s>未限制</div>
<button onclick=toggle()>切换</button>
<small>页面需保持打开(浏览器无法全局监听热键)。</small>
</div>
<script>
var $=function(i){return document.getElementById(i)},sid=sessionStorage.sid,on={},cap=0,
key=localStorage.hk||'F8',N='00000000000000000000000000000000';
function rpc(o,m,a,cb){var x=new XMLHttpRequest();x.open('POST','/ubus');
x.onload=function(){var r=JSON.parse(x.responseText).result;
if(!r||r[0]){if(r&&r[0]==6){sessionStorage.removeItem('sid');sid=0;init()}return}cb&&cb(r[1])};
x.send(JSON.stringify({jsonrpc:'2.0',id:1,method:'call',params:[sid||N,o,m,a]}))}
function login(){sid=0;rpc('session','login',{username:$('u').value,password:$('p').value},function(r){
sid=sessionStorage.sid=r.ubus_rpc_session;init()})}
function v(n){return n<0?'禁止':n?n+'KB/s':'不限'}
function show(){var a=on[$('d').value];$('s').className=a?'on':'';
$('s').textContent=a?'限制中 ↑'+v(a.up)+' ↓'+v(a.down):'未限制'}
function status(){rpc('hotkeylimit','status',{},function(r){on={};(r.active||[]).forEach(function(a){on[a.ip]=a});show()})}
function init(){$('lg').hidden=!!sid;$('m').hidden=!sid;if(!sid)return;$('hk').textContent=key;
rpc('hotkeylimit','devices',{},function(r){$('d').innerHTML='';(r.devices||[]).forEach(function(v){
var o=new Option(v.name+' '+v.ip,v.ip);$('d').add(o)});status()})}
function toggle(){var ip=$('d').value;if(!ip)return;var a=!on[ip];
var u=parseInt($('up').value),w=parseInt($('dn').value);
rpc('hotkeylimit','set',{ip:ip,up:isNaN(u)?-1:u,down:isNaN(w)?0:w,on:a},function(r){if(r&&r.error)alert(r.error);status()})}
function capture(){cap=1;$('hk').textContent='请按键…'}
$('d').onchange=show;
document.onkeydown=function(e){if(cap){key=localStorage.hk=e.key;cap=0;$('hk').textContent=key;e.preventDefault();return}
if(/INPUT|SELECT/.test(e.target.tagName))return;if(e.key==key&&!e.repeat){e.preventDefault();toggle()}};
init();
</script>
