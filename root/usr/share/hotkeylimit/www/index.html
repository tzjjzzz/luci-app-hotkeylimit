<!doctype html>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>热键限速</title>
<style>body{font:15px sans-serif;max-width:420px;margin:1em auto;padding:0 1em}
input,select,button{font:inherit;width:100%;box-sizing:border-box;margin:3px 0;padding:6px}
#s{font-size:1.4em;text-align:center;padding:.5em;border-radius:6px;background:#8c8;margin:.5em 0}
#s.on{background:#e77}</style>
<select id=d></select>
上传 KB/s (-1=禁止, 0=不限)<input id=up type=number min=-1 value=-1>
下载 KB/s (-1=禁止, 0=不限)<input id=dn type=number min=-1 value=0>
热键：<button id=hk onclick=capture()></button>
<div id=s>未限制</div>
<button onclick=toggle()>切换</button>
<small>页面需保持打开且在前台(浏览器无法全局监听热键)。设置会自动记住。</small>
<script>
var $=function(i){return document.getElementById(i)},on={},cap=0,S={dev:'',up:-1,dn:0,hk:'F8'};
try{S=Object.assign(S,JSON.parse(localStorage.hl))}catch(e){}
function save(){S.dev=$('d').value;S.up=$('up').value;S.dn=$('dn').value;try{localStorage.hl=JSON.stringify(S)}catch(e){}}
function api(op,body,cb){var x=new XMLHttpRequest();x.open(body?'POST':'GET','/cgi-bin/api?op='+op);
if(body)x.setRequestHeader('Content-Type','application/json');
x.onload=function(){var r;try{r=JSON.parse(x.responseText)}catch(e){return alert('接口错误')}cb(r)};
x.onerror=function(){alert('连接失败')};x.send(body?JSON.stringify(body):null)}
function v(n){return n<0?'禁止':n?n+'KB/s':'不限'}
function show(){var a=on[$('d').value];$('s').className=a?'on':'';
$('s').textContent=a?'限制中 ↑'+v(a.up)+' ↓'+v(a.down):'未限制'}
function status(){api('status',0,function(r){on={};(r.active||[]).forEach(function(a){on[a.ip]=a});show()})}
function init(){$('up').value=S.up;$('dn').value=S.dn;$('hk').textContent=S.hk;
api('devices',0,function(r){var d=$('d');d.innerHTML='';
(r.devices||[]).forEach(function(x){d.add(new Option(x.name+' '+x.ip,x.ip))});
if(S.dev){d.value=S.dev;if(d.value!=S.dev){d.add(new Option(S.dev,S.dev));d.value=S.dev}}
status()})}
function toggle(){var ip=$('d').value;if(!ip)return;var a=!on[ip],u=parseInt($('up').value),w=parseInt($('dn').value);
api('set',{ip:ip,up:isNaN(u)?-1:u,down:isNaN(w)?0:w,on:a},function(r){if(r.error)alert(r.error);status()})}
function capture(){cap=1;$('hk').textContent='请按键…'}
$('d').onchange=function(){save();show();this.blur()};
$('up').onchange=$('dn').onchange=function(){save();this.blur()};
document.onvisibilitychange=function(){if(!document.hidden)status()};
document.onkeydown=function(e){if(cap){S.hk=e.key;cap=0;$('hk').textContent=e.key;save();e.preventDefault();return}
if(e.target.tagName=='INPUT')return;if(e.key==S.hk&&!e.repeat){e.preventDefault();toggle()}};
init();
</script>
