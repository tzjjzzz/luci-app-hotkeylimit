<!doctype html>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>热键限速</title>
<style>body{font:15px sans-serif;max-width:420px;margin:1em auto;padding:0 1em}
input,select,button{font:inherit;width:100%;box-sizing:border-box;margin:3px 0;padding:6px}
#s{font-size:1.4em;text-align:center;padding:.5em;border-radius:6px;background:#8c8;margin:.5em 0}
#s.on{background:#e77}</style>
<select id=d></select>
上传 KB/s (-1=禁止, 0=不限)<input id=up type=number min=-1 value=-1>
下载 KB/s (-1=禁止, 0=不限)<input id=dn type=number min=-1 value=0>
热键：<button id=hk onclick=capture()></button>
<div id=s>未限制</div>
<button onclick=toggle()>切换</button>
<small>开启后修改数值即时生效。关闭本页或断线后，限制会在约 20 秒内自动取消。<br>
<a id=ps href="/cgi-bin/api?op=ps1&key=F8">下载 Windows 全局热键脚本</a></small>
<script>
var $=function(i){return document.getElementById(i)},on=0,cap=0,tm,S={dev:'',up:-1,dn:0,hk:'F8'};
try{S=Object.assign(S,JSON.parse(localStorage.hl))}catch(e){}
function save(){S.dev=$('d').value;S.up=$('up').value;S.dn=$('dn').value;try{localStorage.hl=JSON.stringify(S)}catch(e){}}
function api(op,body,cb){var x=new XMLHttpRequest();x.open(body?'POST':'GET','/cgi-bin/api?op='+op);
if(body)x.setRequestHeader('Content-Type','application/json');
x.onload=function(){var r;try{r=JSON.parse(x.responseText)}catch(e){return}cb(r)};
x.onerror=function(){$('s').className='';$('s').textContent='连接断开'};x.send(body?JSON.stringify(body):null)}
function v(n){return n<0?'禁止':n?n+'KB/s':'不限'}
function render(r){if(r.error){alert(r.error);return}on=r.on;
$('s').className=on?'on':'';$('s').textContent=on?'限制中 ↑'+v(r.up)+' ↓'+v(r.down):'未限制'}
function vals(){var u=parseInt($('up').value),w=parseInt($('dn').value),ip=$('d').value;
return ip&&u>=-1&&w>=-1?{ip:ip,up:u,down:w}:0}
function sendCfg(){save();var c=vals();if(c)api('cfg',c,render)}
function later(){clearTimeout(tm);tm=setTimeout(sendCfg,300)}
function toggle(){clearTimeout(tm);save();var c=vals();
if(c)api('cfg',c,function(r){if(r.error)return render(r);api('toggle',{},render)});else api('toggle',{},render)}
function pick(ip){var d=$('d');if(!ip)return;d.value=ip;if(d.value!=ip){d.add(new Option(ip,ip));d.value=ip}}
function ps(){var k=S.hk;if(!/^(F([1-9]|1[0-9]|2[0-4])|[A-Za-z])$/.test(k))k='F8';$('ps').href='/cgi-bin/api?op=ps1&key='+k}
function init(){$('up').value=S.up;$('dn').value=S.dn;$('hk').textContent=S.hk;ps();
api('devices',0,function(r){var d=$('d');d.innerHTML='';
(r.devices||[]).forEach(function(x){d.add(new Option(x.name+' '+x.ip,x.ip))});
api('beat',0,function(s){
if(s.ip){$('up').value=s.up;$('dn').value=s.down;pick(s.ip);save()}
else{pick(S.dev);sendCfg()}
render(s)})})}
function capture(){cap=1;$('hk').textContent='请按键…'}
function bt(){api('beat',0,render)}
$('d').onchange=function(){sendCfg();this.blur()};
$('up').oninput=$('dn').oninput=later;
$('up').onchange=$('dn').onchange=function(){this.blur()};
document.onvisibilitychange=function(){if(!document.hidden)bt()};
document.onkeydown=function(e){if(cap){S.hk=e.key;cap=0;$('hk').textContent=e.key;save();ps();e.preventDefault();return}
if(e.target.tagName=='INPUT')return;if(e.key==S.hk&&!e.repeat){e.preventDefault();toggle()}};
try{var w=new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(0)},5000)'])));w.onmessage=bt}catch(e){setInterval(bt,5000)}
init();
</script>
