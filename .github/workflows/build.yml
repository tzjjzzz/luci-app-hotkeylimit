name: build-ipk
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare feed
        run: |
          mkdir -p feed/luci-app-hotkeylimit
          cp -r Makefile root feed/luci-app-hotkeylimit/
      - uses: openwrt/gh-action-sdk@main
        continue-on-error: true
        id: sdk
        env:
          ARCH: x86_64-openwrt-23.05
          FEED_DIR: ${{ github.workspace }}/feed
          PACKAGES: luci-app-hotkeylimit
          NO_DEFAULT_FEEDS: 1
      - name: Publish ipk and logs to release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          find bin -name '*.ipk' -exec cp {} out/ \; 2>/dev/null || true
          [ -d logs ] && tar czf out/build-logs.tgz logs || true
          echo "sdk outcome: ${{ steps.sdk.outcome }}" > out/outcome.txt
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest out/* --title latest --notes "build ${{ steps.sdk.outcome }}"
